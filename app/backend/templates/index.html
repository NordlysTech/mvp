<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solvi</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6C5CE7;
            --accent-color: #00D2D3;
            --background-color: #1E1E2E;
            --surface-color: #2D2D44;
            --text-color: #E0E0E0;
            --border-color: #3F3F5F;
            --hover-color: rgba(108, 92, 231, 0.1);
            --button-border-radius: 8px;
            --button-padding: 0.75rem 1.25rem;
            --sidebar-width: 250px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--surface-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 2rem;
            font-weight: 700;
            font-size: 2.5rem;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 1.5rem;
            width: 100%;
        }

        textarea, input[type="file"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        textarea:focus, input[type="file"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--hover-color);
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            gap: 1rem;
        }

        .button-group button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: var(--button-padding);
            border-radius: var(--button-border-radius);
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-group button:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .button-group button i {
            margin-right: 0.5rem;
        }

        .sidebar-button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: var(--button-padding);
            border-radius: var(--button-border-radius);
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 1rem;
        }

        .sidebar-button:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .sidebar-button i {
            margin-right: 0.5rem;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }

        .file-input-wrapper .btn-file-input {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: var(--button-padding);
            border-radius: var(--button-border-radius);
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .file-input-wrapper .btn-file-input:hover {
            background-color: var(--border-color);
            transform: translateY(-2px);
        }

        .file-input-wrapper .btn-file-input i {
            margin-right: 0.5rem;
        }

        #response-container {
            margin-top: 2.5rem;
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        #response-title {
            color: var(--accent-color);
            margin-bottom: 1rem;
            font-weight: 700;
            font-size: 1.75rem;
        }

        #response-content {
            text-align: justify;
        }

        #response-content p {
            margin-bottom: 1.25rem;
        }

        #response-content h2 {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        #response-content h3 {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--accent-color);
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
        }

        .mjx-chtml {
            font-size: 110% !important;
            color: #ffffff !important;
        }

        .equation-wrapper {
            overflow-x: auto;
            margin: 1rem 0;
            padding: 1rem;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            color: #ffffff !important;
        }

        .express-answer {
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--accent-color); margin-bottom: 2rem;">Actions</h2>
        <div class="file-input-wrapper">
            <button class="btn-file-input"><i data-feather="upload"></i>Choose File</button>
            <input type="file" id="file-input" accept=".txt,.pdf">
        </div>
        <button id="upload-button" class="sidebar-button"><i data-feather="upload-cloud"></i>Upload</button>
        <button id="clear-data" class="sidebar-button"><i data-feather="trash-2"></i>Clear Data</button>
        <button id="generate-pdf-button" class="sidebar-button"><i data-feather="file-text"></i>Generate Report</button>
    </div>

    <div class="main-content">
        <div class="container">
            <h1>Solvi</h1>

            <form id="query-form">
                <div class="input-group">
                    <textarea id="query-input" rows="4" placeholder="Enter your chemical engineering query here"></textarea>
                </div>
                <div class="button-group">
                    <button type="button" id="overview-button"><i data-feather="eye"></i>Overview Analysis</button>
                    <button type="button" id="detailed-button"><i data-feather="book-open"></i>Detailed Analysis</button>
                </div>
            </form>

            <div id="response-container" style="display: none;">
                <h2 id="response-title"></h2>
                <div id="response-content"></div>
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        async function handleQuery(isDetailed) {
            const query = document.getElementById('query-input').value;

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query, isDetailed }),
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('response-title').textContent = data.title || 'Error';
                    document.getElementById('response-content').innerHTML = `<p>${data.message}</p>`;
                } else {
                    document.getElementById('response-title').textContent = data.title;
                    document.getElementById('response-content').innerHTML = formatContent(data.response, isDetailed);
                }

                document.getElementById('response-container').style.display = 'block';

                MathJax.typesetPromise();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('response-title').textContent = 'Error';
                document.getElementById('response-content').innerHTML = '<p>An error occurred while processing your request.</p>';
                document.getElementById('response-container').style.display = 'block';
            }
        }

        function formatContent(content, isDetailed) {
            // Remove any existing HTML tags
            content = content.replace(/\\\((.*?)\\\)/g, '\\($1\\)'); // Inline equations
            content = content.replace(/\\\[(.*?)\\\]/g, '$$$1$$$'); // Block equations

            // Convert double newlines to paragraph breaks
            content = content.split('\n\n').map(para => `<p>${para}</p>`).join('');

            // Process equations
            content = content.replace(/\$\$(.*?)\$\$/g, (match, equation) => {
                return `<div class="equation-wrapper">${match}</div>`;
            });

            // If it's an express answer, wrap it in a special class
            if (!isDetailed) {
                content = `<div class="express-answer">${content}</div>`;
            }

            return content;
        }

        document.getElementById('overview-button').addEventListener('click', () => handleQuery(false));
        document.getElementById('detailed-button').addEventListener('click', () => handleQuery(true));

        document.getElementById('upload-button').addEventListener('click', async () => {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file before uploading.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch('/upload', {
                method: 'POST',
                body: formData,
            });

            const data = await response.json();
            alert(data.message || data.error);
        });

        document.getElementById('clear-data').addEventListener('click', async () => {
            const response = await fetch('/clear', {
                method: 'POST',
            });

            const data = await response.json();
            alert(data.message || data.error);
        });

        document.getElementById('generate-pdf-button').addEventListener('click', async () => {
            const content = document.getElementById('response-content').innerHTML;

            const response = await fetch('/generate-pdf', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ content }),
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'chemical_analysis_report.pdf';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } else {
                const data = await response.json();
                alert('Error generating PDF: ' + (data.error || 'Unknown error'));
            }
        });
    </script>
</body>
</html>
